<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Durian AI</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
}

/* ---------------- NAV ---------------- */
nav {
    display: flex;
    justify-content: space-between;
    padding: 20px 40px;
    background: #111827;
}

nav h1 {
    color: #22c55e;
}

/* ---------------- PAGES ---------------- */
.page {
    display: none;
    padding: 40px;
    text-align: center;
}

.active {
    display: block;
}

/* ---------------- UPLOAD BOX ---------------- */
.upload-box {
    border: 2px dashed #22c55e;
    padding: 60px;
    border-radius: 12px;
    cursor: pointer;
    transition: 0.3s;
}

.upload-box:hover {
    background: rgba(34,197,94,0.1);
}

/* ---------------- BUTTON ---------------- */
button {
    margin-top: 20px;
    padding: 12px 20px;
    border: none;
    background: #22c55e;
    color: black;
    font-weight: bold;
    cursor: pointer;
    border-radius: 8px;
}

/* ---------------- LOADING ---------------- */
.loader {
    border: 6px solid #333;
    border-top: 6px solid #22c55e;
    border-radius: 50%;
    width: 50px;
    height: 50px;
    animation: spin 1s linear infinite;
    margin: auto;
}

@keyframes spin {
    100% { transform: rotate(360deg); }
}

/* ---------------- RESULT BAR ---------------- */
.bar {
    width: 300px;
    height: 20px;
    background: #333;
    margin: auto;
    border-radius: 10px;
}

.fill {
    height: 100%;
    background: #22c55e;
    border-radius: 10px;
}

/* ---------------- HISTORY ---------------- */
.history-item {
    background: #1f2937;
    margin: 10px;
    padding: 10px;
    border-radius: 8px;
}
</style>
</head>

<body>

<nav>
    <h1>Durian AI</h1>
    <div>
        <button onclick="showPage('home')">Home</button>
        <button onclick="showPage('upload')">Upload</button>
        <button onclick="showPage('history')">History</button>
    </div>
</nav>

<!-- ---------------- HOME ---------------- -->
<div id="home" class="page active">
    <h2>AI Durian Ripeness Detector</h2>
    <p>Upload a durian image and let AI tell you if it's ripe 🍈</p>
</div>

<!-- ---------------- UPLOAD ---------------- -->
<div id="upload" class="page">
    <h2>Upload Durian</h2>

    <div class="upload-box" onclick="document.getElementById('file').click()">
        Click or Drop Image Here
        <input type="file" id="file" hidden>
    </div>

    <button onclick="uploadImage()">Analyze</button>

    <div id="loading" style="display:none;">
        <p>Analyzing durian...</p>
        <div class="loader"></div>
    </div>

    <h2 id="result"></h2>
    <div class="bar">
        <div id="fill" class="fill" style="width:0%"></div>
    </div>
</div>

<!-- ---------------- HISTORY ---------------- -->
<div id="history" class="page">
    <h2>History</h2>
    <div id="historyList"></div>
</div>

<script>
const API = "http://127.0.0.1:8000/predict";

// ---------------- PAGE NAV ----------------
function showPage(page) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(page).classList.add('active');

    if (page === "history") loadHistory();
}

// ---------------- UPLOAD ----------------
async function uploadImage() {
    const file = document.getElementById("file").files[0];

    if (!file) {
        alert("Please select an image");
        return;
    }

    document.getElementById("loading").style.display = "block";

    const formData = new FormData();
    formData.append("file", file);

    try {
        const res = await fetch(API, {
            method: "POST",
            body: formData
        });

        const data = await res.json();

        document.getElementById("loading").style.display = "none";

        if (!data.success) {
            document.getElementById("result").innerText = "Error: " + data.error;
            return;
        }

        document.getElementById("result").innerText =
            `Prediction: ${data.prediction}`;

        document.getElementById("fill").style.width =
            data.confidence + "%";

        saveHistory(data);

    } catch (err) {
        document.getElementById("loading").style.display = "none";
        alert("Backend not reachable");
    }
}

// ---------------- HISTORY ----------------
function saveHistory(data) {
    let history = JSON.parse(localStorage.getItem("history")) || [];

    history.push({
        prediction: data.prediction,
        confidence: data.confidence,
        time: new Date().toLocaleString()
    });

    localStorage.setItem("history", JSON.stringify(history));
}

function loadHistory() {
    let history = JSON.parse(localStorage.getItem("history")) || [];

    const list = document.getElementById("historyList");
    list.innerHTML = "";

    history.reverse().forEach(item => {
        list.innerHTML += `
            <div class="history-item">
                <b>${item.prediction}</b><br>
                Confidence: ${item.confidence}%<br>
                <small>${item.time}</small>
            </div>
        `;
    });
}
</script>

</body>
</html>
